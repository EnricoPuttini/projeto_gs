spring:
  application:
    name: zelo
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:zelo}
    # Sem default de proposito: a senha vem sempre do ambiente (.env local / painel do Render).
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1   # o Oracle compartilhado da FIAP limita sessoes: nao mantenha conexoes ociosas
      connection-timeout: 10000
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false   # usamos nosso proprio @RestControllerAdvice

zelo:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  demo-mode: ${ZELO_DEMO_MODE:false}
  timezone: America/Sao_Paulo

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
